<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img"><title>Three networks side by side (v2)</title><desc>YOLOv8s, body model and face model compared by input, structure, output and training data.</desc><style>
  .box-teal { fill:#E1F5EE; stroke:#0F6E56; } .box-blue { fill:#E6F1FB; stroke:#185FA5; }
  .box-purple { fill:#EEEDFE; stroke:#534AB7; } .box-gray { fill:#F1EFE8; stroke:#5F5E5A; }
  .box-coral { fill:#FAECE7; stroke:#993C1D; }
  .t { font: 500 14px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .s { font: 400 12px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .teal { fill:#085041; } .teal2 { fill:#0F6E56; } .blue { fill:#0C447C; } .blue2 { fill:#185FA5; }
  .purple { fill:#3C3489; } .purple2 { fill:#534AB7; } .gray { fill:#444441; } .gray2 { fill:#5F5E5A; }
  .coral { fill:#712B13; } .coral2 { fill:#993C1D; }
  .arr { fill:none; stroke:#5F5E5A; stroke-width:1.5; }
  @media (prefers-color-scheme: dark) {
    .box-teal { fill:#085041; stroke:#5DCAA5; } .box-blue { fill:#0C447C; stroke:#85B7EB; }
    .box-purple { fill:#3C3489; stroke:#AFA9EC; } .box-gray { fill:#444441; stroke:#B4B2A9; }
    .box-coral { fill:#712B13; stroke:#F0997B; }
    .teal, .blue, .purple, .gray, .coral { fill:#F1EFE8; } .teal2, .blue2, .purple2, .gray2, .coral2 { fill:#D3D1C7; }
    .arr { stroke:#B4B2A9; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="190" height="316" rx="12" stroke-width="0.8" class="box-teal"/><text class="t teal" x="135" y="56">YOLOv8s</text><rect x="52" y="78" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="135" y="95">Input: frame (BGR)</text><rect x="52" y="122" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="135" y="139">CSPDarknet backbone</text><rect x="52" y="166" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="135" y="183">PANet feature pyramid</text><rect x="52" y="210" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="135" y="227">Detect head + NMS</text><rect x="52" y="254" width="166" height="34" rx="6" stroke-width="0.6" class="box-blue"/><text class="s blue" x="135" y="271">Output: cat box</text><rect x="52" y="298" width="166" height="34" rx="6" stroke-width="0.6" class="box-purple"/><text class="s purple" x="135" y="315">Trained on COCO</text><rect x="245" y="30" width="190" height="316" rx="12" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340" y="56">Body model</text><rect x="257" y="78" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="340" y="95">Input: 256 x 256 crop</text><rect x="257" y="122" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="340" y="139">MobileNetV3-large</text><rect x="257" y="166" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="340" y="183">FPN, stride 8/16/32</text><rect x="257" y="210" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="340" y="227">Heatmaps + soft-argmax</text><rect x="257" y="254" width="166" height="34" rx="6" stroke-width="0.6" class="box-blue"/><text class="s blue" x="340" y="271">Output: 20 (x, y) + conf</text><rect x="257" y="298" width="166" height="34" rx="6" stroke-width="0.6" class="box-purple"/><text class="s purple" x="340" y="315">5 species, then cats</text><rect x="450" y="30" width="190" height="316" rx="12" stroke-width="0.8" class="box-teal"/><text class="t teal" x="545" y="56">Face model</text><rect x="462" y="78" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="545" y="95">Input: 256 x 256 crop</text><rect x="462" y="122" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="545" y="139">MobileNetV3-large</text><rect x="462" y="166" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="545" y="183">FPN, stride 8/16/32</text><rect x="462" y="210" width="166" height="34" rx="6" stroke-width="0.6" class="box-gray"/><text class="s gray" x="545" y="227">Heatmaps + soft-argmax</text><rect x="462" y="254" width="166" height="34" rx="6" stroke-width="0.6" class="box-blue"/><text class="s blue" x="545" y="271">Output: 48 (x, y) + conf</text><rect x="462" y="298" width="166" height="34" rx="6" stroke-width="0.6" class="box-purple"/><text class="s purple" x="545" y="315">Trained on CatFLW</text><text class="s gray2" x="340" y="372">Flow: YOLOv8s cat box -&gt; body model -&gt; head box -&gt; face model (x2)</text><text class="s gray2" x="340" y="394">Body and face share one architecture; only weights and output count differ.</text></svg>
