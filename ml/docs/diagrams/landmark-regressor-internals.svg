<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 534" role="img"><title>Inside a v2 landmark model</title><desc>Crop, MobileNetV3-large backbone, FPN neck, heatmap head, soft-argmax decoding, loss, and mapping back to image pixels.</desc><style>
  .box-teal { fill:#E1F5EE; stroke:#0F6E56; } .box-blue { fill:#E6F1FB; stroke:#185FA5; }
  .box-purple { fill:#EEEDFE; stroke:#534AB7; } .box-gray { fill:#F1EFE8; stroke:#5F5E5A; }
  .box-coral { fill:#FAECE7; stroke:#993C1D; }
  .t { font: 500 14px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .s { font: 400 12px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .teal { fill:#085041; } .teal2 { fill:#0F6E56; } .blue { fill:#0C447C; } .blue2 { fill:#185FA5; }
  .purple { fill:#3C3489; } .purple2 { fill:#534AB7; } .gray { fill:#444441; } .gray2 { fill:#5F5E5A; }
  .coral { fill:#712B13; } .coral2 { fill:#993C1D; }
  .arr { fill:none; stroke:#5F5E5A; stroke-width:1.5; }
  @media (prefers-color-scheme: dark) {
    .box-teal { fill:#085041; stroke:#5DCAA5; } .box-blue { fill:#0C447C; stroke:#85B7EB; }
    .box-purple { fill:#3C3489; stroke:#AFA9EC; } .box-gray { fill:#444441; stroke:#B4B2A9; }
    .box-coral { fill:#712B13; stroke:#F0997B; }
    .teal, .blue, .purple, .gray, .coral { fill:#F1EFE8; } .teal2, .blue2, .purple2, .gray2, .coral2 { fill:#D3D1C7; }
    .arr { stroke:#B4B2A9; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="120" y="30" width="440" height="60" rx="8" stroke-width="0.8" class="box-gray"/><text class="t gray" x="340.0" y="50">Affine crop to 256 x 256</text><text class="s gray2" x="340.0" y="71">ImageNet normalisation, zero padding, no stretching</text><line x1="340" y1="90" x2="340" y2="112" class="arr" marker-end="url(#a)"/><rect x="120" y="114" width="440" height="60" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340.0" y="134">MobileNetV3-large backbone</text><text class="s teal2" x="340.0" y="155">taps at stride 8 (40ch), 16 (112ch), 32 (960ch)</text><line x1="340" y1="174" x2="340" y2="196" class="arr" marker-end="url(#a)"/><rect x="120" y="198" width="440" height="60" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340.0" y="218">FPN neck</text><text class="s teal2" x="340.0" y="239">each scale -> 96ch, merged top-down onto a 32 x 32 grid</text><line x1="340" y1="258" x2="340" y2="280" class="arr" marker-end="url(#a)"/><rect x="120" y="282" width="440" height="60" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340.0" y="302">Refine + head</text><text class="s teal2" x="340.0" y="323">2 depthwise-separable convs, 1 x 1 conv -> K heatmaps</text><line x1="340" y1="342" x2="340" y2="364" class="arr" marker-end="url(#a)"/><rect x="120" y="366" width="440" height="60" rx="8" stroke-width="0.8" class="box-purple"/><text class="t purple" x="340.0" y="386">Softmax + soft-argmax</text><text class="s purple2" x="340.0" y="407">expected (u, v) per heatmap; confidence = peak mass</text><line x1="340" y1="426" x2="340" y2="448" class="arr" marker-end="url(#a)"/><rect x="120" y="450" width="440" height="60" rx="8" stroke-width="0.8" class="box-blue"/><text class="t blue" x="340.0" y="470">Inverse affine -> original-image pixels</text><text class="s blue2" x="340.0" y="491">K = 20 body, 48 face; flip TTA averages two views</text></svg>
