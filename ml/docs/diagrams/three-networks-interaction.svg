<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 760" role="img"><title>How YOLO and the two landmark networks interact (v2)</title><desc>YOLO finds the cat, the body model places 20 keypoints, confident head keypoints define a face box, the face model runs twice, outputs merge.</desc><style>
  .box-teal { fill:#E1F5EE; stroke:#0F6E56; } .box-blue { fill:#E6F1FB; stroke:#185FA5; }
  .box-purple { fill:#EEEDFE; stroke:#534AB7; } .box-gray { fill:#F1EFE8; stroke:#5F5E5A; }
  .box-coral { fill:#FAECE7; stroke:#993C1D; }
  .t { font: 500 14px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .s { font: 400 12px -apple-system, "SF Pro Text", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .teal { fill:#085041; } .teal2 { fill:#0F6E56; } .blue { fill:#0C447C; } .blue2 { fill:#185FA5; }
  .purple { fill:#3C3489; } .purple2 { fill:#534AB7; } .gray { fill:#444441; } .gray2 { fill:#5F5E5A; }
  .coral { fill:#712B13; } .coral2 { fill:#993C1D; }
  .arr { fill:none; stroke:#5F5E5A; stroke-width:1.5; }
  @media (prefers-color-scheme: dark) {
    .box-teal { fill:#085041; stroke:#5DCAA5; } .box-blue { fill:#0C447C; stroke:#85B7EB; }
    .box-purple { fill:#3C3489; stroke:#AFA9EC; } .box-gray { fill:#444441; stroke:#B4B2A9; }
    .box-coral { fill:#712B13; stroke:#F0997B; }
    .teal, .blue, .purple, .gray, .coral { fill:#F1EFE8; } .teal2, .blue2, .purple2, .gray2, .coral2 { fill:#D3D1C7; }
    .arr { stroke:#B4B2A9; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.8" class="box-gray"/><text class="t gray" x="340.0" y="52.0">Camera frame</text><line x1="340" y1="74" x2="340" y2="98" class="arr" marker-end="url(#a)"/><rect x="200" y="100" width="280" height="64" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340.0" y="122.0">1. YOLOv8s</text><text class="s teal2" x="340.0" y="143.0">Cat box (COCO class 15), every 2 frames</text><line x1="340" y1="164" x2="340" y2="196" class="arr" marker-end="url(#a)"/><rect x="200" y="198" width="280" height="64" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="340.0" y="220.0">2. Body model</text><text class="s teal2" x="340.0" y="241.0">20 keypoints + confidence</text><path d="M280 262 L140 262 L140 306" class="arr" marker-end="url(#a)"/><path d="M400 262 L540 262 L540 306" class="arr" marker-end="url(#a)"/><rect x="40" y="308" width="200" height="64" rx="8" stroke-width="0.8" class="box-blue"/><text class="t blue" x="140.0" y="330.0">20 body keypoints</text><text class="s blue2" x="140.0" y="351.0">One-Euro smoothed</text><rect x="430" y="308" width="220" height="64" rx="8" stroke-width="0.8" class="box-purple"/><text class="t purple" x="540.0" y="330.0">Face box from head</text><text class="s purple2" x="540.0" y="351.0">eyes/nose/ears, conf >= 0.25</text><line x1="540" y1="372" x2="540" y2="404" class="arr" marker-end="url(#a)"/><rect x="420" y="406" width="240" height="64" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="540.0" y="428.0">3. Face model, pass 1</text><text class="s teal2" x="540.0" y="449.0">on the rough head box</text><line x1="540" y1="470" x2="540" y2="502" class="arr" marker-end="url(#a)"/><rect x="420" y="504" width="240" height="64" rx="8" stroke-width="0.8" class="box-teal"/><text class="t teal" x="540.0" y="526.0">3. Face model, pass 2</text><text class="s teal2" x="540.0" y="547.0">on box rebuilt from pass 1</text><line x1="540" y1="568" x2="540" y2="600" class="arr" marker-end="url(#a)"/><rect x="440" y="602" width="200" height="44" rx="8" stroke-width="0.8" class="box-blue"/><text class="t blue" x="540.0" y="624.0">48 face landmarks</text><path d="M140 372 L140 676 L280 676 L280 694" class="arr" marker-end="url(#a)"/><path d="M540 646 L540 676 L400 676 L400 694" class="arr" marker-end="url(#a)"/><rect x="240" y="696" width="200" height="44" rx="8" stroke-width="0.8" class="box-gray"/><text class="t gray" x="340.0" y="718.0">JSON + overlay</text></svg>
